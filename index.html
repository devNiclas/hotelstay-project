<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAY. | Boka hotell</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-dark bg-dark py-3 mb-5 sticky-top">
        <div class="container">
          <a class="navbar-brand fw-bold fs-3" href="index.html"
            >STAY<span class="text-warning">.</span></a
          >
        </div>
      </nav>
    </header>

    <main class="container my-5">
      <section id="rooms-selection">
        <h1 class="text-center">Våra rum</h1>
        <div class="row g-4">
          <div class="col-4">
            <div class="card h-100 shadow-sm">
              <img
                src="assets/standard.png.png"
                class="card-img-top"
                alt="Standard rum"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Standard</h5>
                <p card-text text-secondary>
                  Ett prisvärt och mysigt rum för den enkla vistelsen
                </p>
                <p class="fw-bold mt-auto">995 kr / natt</p>
                <button
                  class="btn btn-primary w-100 mt-2"
                  onclick="valjRum('Standard')"
                >
                  Välj rum
                </button>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="card h-100 shadow-sm border-primary">
                    <img src="assets/deluxe.png.png" class="card-img-top" alt="Deluxe rum">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Deluxe</h5>
                        <p class="card-text text-secondary">Extra utrymme, frukost på rummet och fantastisk utsikt.</p>
                        <p class="fw-bold mt-auto">1 895 kr / natt</p>
                        <button class="btn btn-primary w-100 mt-2" onclick="valjRum('Deluxe')">Välj rum</button>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card h-100 shadow-sm">
                    <img src="assets/suite.png.png" class="card-img-top" alt="Svit">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Den stora sviten</h5>
                        <p class="card-text text-secondary">Vår lyxigaste upplevelse med egen jacuzzi och lounge.</p>
                        <p class="fw-bold mt-auto">3 495 kr / natt</p>
                        <button class="btn btn-primary w-100 mt-2" onclick="valjRum('Svit')">Välj rum</button>
                    </div>
                </div>
            </div>
        </div>
      </section>

      <section id="booking-form-selection" class="d-none"></section>
    </main>
  </body>
</html>
